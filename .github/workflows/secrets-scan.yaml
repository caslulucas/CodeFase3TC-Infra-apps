name: Secret Scan

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    name: Detect Exposed Secrets
    runs-on: ubuntu-latest
    
    steps:
      # O histórico completo permite analisar alterações e commits.
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Detecta credenciais, tokens e outros segredos versionados.
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}