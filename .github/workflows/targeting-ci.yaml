name: Targeting CI
on:
  push:
    branches:
      - main
    paths:
      - "02-services/targeting-service/**"
      - ".github/workflows/targeting-ci.yaml"
  pull_request:
    branches:
      - main
    paths:
      - "02-services/targeting-service/**"
      - ".github/workflows/targeting-ci.yaml"

permissions:
  contents: read
env:
  AWS_REGION: us-east-1
  SERVICE_DIR: 02-services/targeting-service
  ECR_REPOSITORY: togglemaster-targeting
  LOCAL_IMAGE: togglemaster-targeting:${{ github.sha }}
  GITOPS_REPOSITORY: caslulucas/CodeFase3TC-GitOps
  GITOPS_DEPLOYMENT: apps/targeting/deployment.yaml

jobs:
  validate-build-and-scan:
    name: Test, Security and Docker Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ env.SERVICE_DIR }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ${{ env.SERVICE_DIR }}/requirements.txt

      - name: Install dependencies and analysis tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest flake8 bandit

      - name: Run unit tests
        run: pytest -v

      - name: Run blocking Flake8 checks
        run: |
          flake8 . \
            --count \
            --select=E9,F63,F7,F82 \
            --show-source \
            --statistics

      - name: Run complete Flake8 report
        run: |
          flake8 . \
            --count \
            --exit-zero \
            --max-complexity=10 \
            --max-line-length=120 \
            --statistics

      - name: Run Bandit SAST
        run: bandit -r . -ll

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: ${{ env.SERVICE_DIR }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Build Docker image
        run: docker build -t "${LOCAL_IMAGE}" .

      - name: Run Trivy container scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.LOCAL_IMAGE }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and push image to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IMAGE_URI="${{ steps.login-ecr.outputs.registry }}/${ECR_REPOSITORY}:${GITHUB_SHA}"

          docker tag "${LOCAL_IMAGE}" "${IMAGE_URI}"
          docker push "${IMAGE_URI}"

          echo "IMAGE_URI=${IMAGE_URI}" >> "${GITHUB_ENV}"

      - name: Update Targeting image in GitOps repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: ${{ github.workspace }}
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        run: |
          git clone \
            "https://x-access-token:${GITOPS_TOKEN}@github.com/${GITOPS_REPOSITORY}.git" \
            gitops

          cd gitops

          sed -i -E \
            "s|^([[:space:]]*)image: .*togglemaster-targeting:.*$|\1image: ${IMAGE_URI}|" \
            "${GITOPS_DEPLOYMENT}"

          if git diff --quiet; then
            echo "O deployment já contém a imagem ${IMAGE_URI}."
            exit 0
          fi

          git config user.name "togglemaster-ci"
          git config user.email "togglemaster-ci@users.noreply.github.com"

          git add "${GITOPS_DEPLOYMENT}"
          git commit -m "chore(targeting): update image to ${GITHUB_SHA}"
          git push origin main