name: Auth CI

on:
  push:
    branches:
      - main
    paths:
      - "02-services/auth-service/**"
      - ".github/workflows/auth-ci.yaml"

  pull_request:
    branches:
      - main
    paths:
      - "02-services/auth-service/**"
      - ".github/workflows/auth-ci.yaml"

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  SERVICE_DIR: 02-services/auth-service
  ECR_REPOSITORY: togglemaster-auth
  LOCAL_IMAGE: togglemaster-auth:${{ github.sha }}
  GITOPS_REPOSITORY: caslulucas/CodeFase3TC-GitOps
  GITOPS_DEPLOYMENT: apps/auth/deployment.yaml

jobs:
  validate-build-and-scan:
    name: Test, Security and Docker Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ env.SERVICE_DIR }}

    steps:
      # Obtém o código-fonte do repositório.
      - name: Checkout source code
        uses: actions/checkout@v4

      # Instala o Go utilizado pelo serviço Auth.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.SERVICE_DIR }}/go.mod
          cache: true
          cache-dependency-path: ${{ env.SERVICE_DIR }}/go.mod

      # Baixa e valida as dependências declaradas no go.mod.
      - name: Download Go dependencies
        run: go mod download

      # Verifica se o código pode ser compilado.
      - name: Build application
        run: go build ./...

      # Executa os testes unitários do microsserviço.
      - name: Run unit tests
        run: go test -v ./...

      # Executa lint para identificar problemas de qualidade.
      - name: Run GolangCI-Lint
        uses: golangci/golangci-lint-action@v6
        with:
          working-directory: ${{ env.SERVICE_DIR }}
          version: latest

      # Instala o Gosec, ferramenta SAST para código Go.
      - name: Install Gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest

        # Gera visibilidade sobre todos os achados do SAST.
      # Achados baixos e médios permanecem documentados no log da pipeline.
      - name: Run complete Gosec report
        continue-on-error: true
        run: gosec -fmt=text ./...

      # Bloqueia o pipeline para achados de alta severidade
      # e alta confiança.
      - name: Enforce Gosec security gate
        run: gosec -severity high -confidence high ./...

      # Executa SCA no sistema de arquivos e nas dependências.
      # Vulnerabilidades críticas fazem o job falhar.
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: ${{ env.SERVICE_DIR }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      # Constrói a imagem local antes de qualquer push.
      - name: Build Docker image
        run: docker build -t "${LOCAL_IMAGE}" .

      # Analisa a imagem completa, incluindo imagem-base e pacotes.
      - name: Run Trivy container scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.LOCAL_IMAGE }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      # Os passos seguintes executam apenas em push para a Main.
      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Versiona e publica a imagem utilizando o hash do commit.
      - name: Tag and push image to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IMAGE_URI="${{ steps.login-ecr.outputs.registry }}/${ECR_REPOSITORY}:${GITHUB_SHA}"

          docker tag "${LOCAL_IMAGE}" "${IMAGE_URI}"
          docker push "${IMAGE_URI}"

          echo "IMAGE_URI=${IMAGE_URI}" >> "${GITHUB_ENV}"

      # Atualiza o estado desejado no repositório GitOps.
      - name: Update Auth image in GitOps repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: ${{ github.workspace }}
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        run: |
          git clone \
            "https://x-access-token:${GITOPS_TOKEN}@github.com/${GITOPS_REPOSITORY}.git" \
            gitops

          cd gitops

          sed -i -E \
            "s|^([[:space:]]*)image: .*togglemaster-auth:.*$|\1image: ${IMAGE_URI}|" \
            "${GITOPS_DEPLOYMENT}"

          if git diff --quiet; then
            echo "O deployment já contém a imagem ${IMAGE_URI}."
            exit 0
          fi

          git config user.name "togglemaster-ci"
          git config user.email "togglemaster-ci@users.noreply.github.com"

          git add "${GITOPS_DEPLOYMENT}"
          git commit -m "chore(auth): update image to ${GITHUB_SHA}"
          git push origin main