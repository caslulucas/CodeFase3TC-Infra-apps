name: Flag CI

on:
  push:
    branches:
      - main
    paths:
      - "02-services/flag-service/**"
      - ".github/workflows/flag-ci.yaml"

  pull_request:
    branches:
      - main
    paths:
      - "02-services/flag-service/**"
      - ".github/workflows/flag-ci.yaml"

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  SERVICE_DIR: 02-services/flag-service
  ECR_REPOSITORY: togglemaster-flag
  GITOPS_REPOSITORY: caslulucas/CodeFase3TC-GitOps
  GITOPS_DEPLOYMENT: apps/flag/deployment.yaml

jobs:
  validate-build-and-scan:
    name: Validate Flag Service
    runs-on: ubuntu-latest

    steps:
      # Baixa o código-fonte para o runner do GitHub Actions.
      - name: Checkout source code
        uses: actions/checkout@v4

      # Instala a versão de Python utilizada pelo microsserviço.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: "02-services/flag-service/requirements.txt"

      # Instala dependências da aplicação e ferramentas de análise.
      - name: Install dependencies and analysis tools
        working-directory: ${{ env.SERVICE_DIR }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest flake8 bandit

      # Executa os testes unitários existentes.
      - name: Run unit tests
        working-directory: ${{ env.SERVICE_DIR }}
        run: pytest -v

      # Bloqueia erros graves de sintaxe ou nomes inválidos.
      - name: Run blocking Flake8 checks
        working-directory: ${{ env.SERVICE_DIR }}
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      # Gera um relatório mais amplo de qualidade sem bloquear por estilo.
      - name: Run complete Flake8 report
        working-directory: ${{ env.SERVICE_DIR }}
        run: flake8 . --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

      # Executa análise estática de segurança específica para Python.
      - name: Run Bandit SAST
        working-directory: ${{ env.SERVICE_DIR }}
        run: bandit -r . -x tests -ll

      # Verifica vulnerabilidades críticas nas dependências e arquivos.
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: ${{ env.SERVICE_DIR }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      # Constrói a imagem Docker localmente.
      - name: Build Docker image
        working-directory: ${{ env.SERVICE_DIR }}
        run: docker build -t "togglemaster-flag:${GITHUB_SHA}" .

      # Analisa a imagem completa antes da publicação.
      - name: Run Trivy container scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: togglemaster-flag:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      # Os passos de publicação executam apenas em push para a main.
      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      # Autentica o runner no Amazon ECR.
      - name: Login to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Publica a imagem usando o hash do commit como tag.
      - name: Push Docker image to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: ${{ env.SERVICE_DIR }}
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"
          docker tag "togglemaster-flag:${GITHUB_SHA}" "${IMAGE_URI}"
          docker push "${IMAGE_URI}"
          echo "IMAGE_URI=${IMAGE_URI}" >> "${GITHUB_ENV}"

      # Atualiza a imagem declarada no repositório GitOps.
      - name: Update Flag deployment in GitOps repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        run: |
          git clone "https://x-access-token:${GITOPS_TOKEN}@github.com/${GITOPS_REPOSITORY}.git" gitops
          cd gitops

          sed -i -E "s|^([[:space:]]*)image: .*togglemaster-flag:.*$|\1image: ${IMAGE_URI}|" "${GITOPS_DEPLOYMENT}"

          if git diff --quiet; then
            echo "* manifesto já referencia a imagem ${IMAGE_URI}."
            exit 0
          fi

          git config user.name "togglemaster-ci"
          git config user.email "togglemaster-ci@users.noreply.github.com"

          git add "${GITOPS_DEPLOYMENT}"
          git commit -m "chore(flag): update image to ${GITHUB_SHA}"
          git push origin main